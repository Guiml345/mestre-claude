# Compila a extensão e publica no GitHub Pages a cada envio para a branch main.
# O manifesto fica em https://guiml345.github.io/mestre-claude/manifest.json
#
# Montar e publicar são etapas separadas: se só a publicação falhar (erro
# temporário do GitHub), "Re-run failed jobs" repete só ela, sem gerar um
# segundo pacote do site.
name: Publicar extensão

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:ext
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: extension/dist

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
